<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Trindade</title>
<meta name="theme-color" content="#020617" />
<meta name="description" content="Saude, tarefas, financas, estudo, trabalho, casal e pets" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="icon" href="icon-192.png" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap");
  html, body { margin:0; padding:0; background:#020617; }
  #root { min-height:100vh; }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script>
  const FIREBASE_URL = "https://apps-5716a-default-rtdb.firebaseio.com";
  const sanitize = (k) => k.replace(/[.#$\[\]:]/g, "_");

  window.storage = {
    get: async (key, shared) => {
      const safeKey = sanitize(key);
      const res = await fetch(FIREBASE_URL + "/trindade/" + safeKey + ".json");
      if (!res.ok) throw new Error("Falha ao ler do Firebase");
      const val = await res.json();
      if (val === null || val === undefined) return null;
      return { key, value: val, shared: !!shared };
    },
    set: async (key, value, shared) => {
      const safeKey = sanitize(key);
      try {
        const res = await fetch(FIREBASE_URL + "/trindade/" + safeKey + ".json", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(value),
        });
        if (!res.ok) return null;
        return { key, value, shared: !!shared };
      } catch (e) { return null; }
    },
    delete: async (key, shared) => {
      const safeKey = sanitize(key);
      await fetch(FIREBASE_URL + "/trindade/" + safeKey + ".json", { method: "DELETE" });
      return { key, deleted: true, shared: !!shared };
    },
    list: async (prefix, shared) => {
      const res = await fetch(FIREBASE_URL + "/trindade.json?shallow=true");
      const val = (await res.json()) || {};
      const keys = Object.keys(val).filter((k) => !prefix || k.startsWith(sanitize(prefix)));
      return { keys, prefix, shared: !!shared };
    },
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

<script id="app-code" type="text/plain">
const { useState, useEffect, useMemo, useRef } = React;
const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceLine, CartesianGrid, BarChart, Bar } = Recharts;

/* ---------------- ícones (emoji, sem dependência externa) ---------------- */
function makeIcon(char) {
  return function Icon({ size = 16, className = "" }) {
    return <span className={className} style={{ fontSize: size, lineHeight: 1, display: "inline-block" }}>{char}</span>;
  };
}
const Ic = {
  Drop: makeIcon("💧"), Dumbbell: makeIcon("🏋️"), Chart: makeIcon("📈"), Food: makeIcon("🍽️"),
  Scale: makeIcon("⚖️"), Camera: makeIcon("📷"), Plus: makeIcon("➕"), Trash: makeIcon("🗑️"),
  Left: makeIcon("‹"), Right: makeIcon("›"), Target: makeIcon("🎯"), Gear: makeIcon("⚙️"),
  Flame: makeIcon("🔥"), Warn: makeIcon("⚠️"), Sync: makeIcon("🔄"), Health: makeIcon("🩺"),
  Check: makeIcon("✅"), Money: makeIcon("💰"), Study: makeIcon("📚"), Work: makeIcon("💼"),
  Heart: makeIcon("💞"), Pet: makeIcon("🐾"), Bell: makeIcon("🔔"), Edit: makeIcon("✏️"),
  Calendar: makeIcon("🗓️"),
};

/* ---------------- utilitários gerais ---------------- */
const iso = (d) => { const t = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return t.toISOString().slice(0, 10); };
const hoje = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const curto = (s) => { const [, m, d] = s.split("-"); return `${d}/${m}`; };
const longo = (s) => { const [y, m, d] = s.split("-"); return `${d}/${m}/${y}`; };
const n = (v) => parseFloat(v) || 0;
const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = (v) => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtCompact = (v) => { v = v || 0; return Math.abs(v) >= 1000 ? (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + "k" : v.toLocaleString("pt-BR", { maximumFractionDigits: 0 }); };
const horaAgora = () => new Date().getHours();
const mesAtual = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
const mesLabel = (key) => { const [y, m] = key.split("-").map(Number); const names = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"]; return `${names[m-1]}/${y}`; };

const THEMES = {
  pedro: { label: "Pedro", accent: "#22d3ee", accentSoft: "rgba(34,211,238,0.15)" },
  mariana: { label: "Mariana", accent: "#e879f9", accentSoft: "rgba(232,121,249,0.15)" },
};
/* ================= SAÚDE: fitness diário ================= */
const MUSC = { leve: 3.5, moderado: 5.0, intenso: 6.0 };
const AERO = { caminhada: 3.5, "caminhada rápida": 4.3, bicicleta: 7.0, elíptico: 5.0, "corrida leve": 8.3, corrida: 10.0, natação: 7.0, "esteira inclinada": 6.0 };
const ALONG_MET = 2.3;
const LIMITE_GORD = 35;
const KCAL_KG = 7700;
const NEAT = [
  { v: 1.2, l: "Sedentário" }, { v: 1.3, l: "Leve" }, { v: 1.375, l: "Moderado" }, { v: 1.5, l: "Ativo" },
];
const burn = (met, min, kg) => (min > 0 && kg > 0 ? Math.round(((met - 1) * 3.5 * kg / 200) * min) : 0);
const tmbDe = (kg, alt, idade, sexo) => Math.round(10 * kg + 6.25 * alt - 5 * idade + (sexo === "m" ? 5 : -161));

function novoDiaSaude() { return { agua: 0, musc: 0, muscInt: "moderado", aero: 0, aeroTipo: "caminhada", along: 0, comidas: [], peso: "", gord: "", massa: "" }; }
function novoPerfilSaude(sexo, kcalMin) { return { sexo, idade: "", altura: "", pesoInicial: "", meta: "", neat: 1.375, metaAgua: "", metaProt: "", kcalMin }; }

function Card({ children, className = "" }) { return <div className={`bg-slate-900 rounded-2xl p-4 border border-slate-800 ${className}`}>{children}</div>; }
function Titulo({ icon: Icon, children, accent, extra }) {
  return (
    <div className="flex items-center justify-between mb-3">
      <div className="flex items-center gap-2"><Icon size={17} /><h3 className="font-semibold text-sm" style={{color:"#e2e8f0"}}>{children}</h3></div>
      {extra}
    </div>
  );
}
const Num = (p) => <input type="number" inputMode="decimal" {...p} className={`bg-slate-800 rounded-lg px-3 py-2 text-sm w-full outline-none focus:ring-1 focus:ring-slate-600 ${p.className || ""}`} />;
function Aviso({ children }) { return <p className="mt-2 text-[11px] text-amber-400 flex gap-1.5"><Ic.Warn size={13} className="shrink-0 mt-0.5" /><span>{children}</span></p>; }

function SaudeHoje({ P, D, dia, onDia, setPerfilCampo, setDiaCampo, accent }) {
  const completo = n(P.idade) > 0 && n(P.altura) > 0 && n(P.pesoInicial) > 0 && n(P.meta) > 0;
  const pesoAtualAux = n(D.peso) > 0 ? n(D.peso) : n(P.pesoInicial);
  const calc = (rec, kg) => {
    const kMusc = burn(MUSC[rec.muscInt] || 5, rec.musc, kg);
    const kAero = burn(AERO[rec.aeroTipo] || 3.5, rec.aero, kg);
    const kAlong = burn(ALONG_MET, rec.along, kg);
    return { kMusc, kAero, kAlong, treino: kMusc + kAero + kAlong };
  };
  const tmb = completo && pesoAtualAux ? tmbDe(pesoAtualAux, n(P.altura), n(P.idade), P.sexo) : 0;
  const t = calc(D, pesoAtualAux);
  const gastoTotal = tmb ? Math.round(tmb * P.neat) + t.treino : 0;
  const consumido = D.comidas.reduce((a, c) => a + n(c.kcal), 0);
  const protTotal = D.comidas.reduce((a, c) => a + n(c.prot), 0);
  const gordTotal = D.comidas.reduce((a, c) => a + n(c.gord), 0);
  const saldo = consumido - gastoTotal;
  const metaAgua = n(P.metaAgua) > 0 ? n(P.metaAgua) : Math.round(pesoAtualAux * 35);
  const metaProt = n(P.metaProt) > 0 ? n(P.metaProt) : Math.round(pesoAtualAux * 1.8);
  const kcalMin = n(P.kcalMin);
  const deficit = saldo < 0;
  const kgSem = (Math.abs(saldo) * 7) / KCAL_KG;
  const pctProt = metaProt > 0 ? Math.min(100, Math.round((protTotal / metaProt) * 100)) : 0;
  const pctGord = consumido > 0 ? Math.round(((gordTotal * 9) / consumido) * 100) : 0;
  const gordAlta = consumido >= 600 && pctGord > LIMITE_GORD;

  const [nomeC, setNomeC] = useState(""); const [kcalC, setKcalC] = useState(""); const [protC, setProtC] = useState(""); const [gordC, setGordC] = useState("");
  const addComida = () => {
    if (!nomeC.trim() || !kcalC) return;
    setDiaCampo("comidas", [...D.comidas, { nome: nomeC.trim(), kcal: n(kcalC), prot: n(protC), gord: n(gordC) }]);
    setNomeC(""); setKcalC(""); setProtC(""); setGordC("");
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl px-3 py-2">
        <button onClick={() => onDia(addDays(dia, -1))} className="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center active:scale-95"><Ic.Left size={16}/></button>
        <div className="text-sm font-medium">{dia === hoje() ? "Hoje" : longo(dia)}</div>
        <button onClick={() => onDia(addDays(dia, 1))} disabled={dia >= hoje()} className="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center active:scale-95 disabled:opacity-30"><Ic.Right size={16}/></button>
      </div>

      {!completo && (
        <div className="w-full flex items-center gap-2 bg-amber-500/15 border border-amber-500/40 text-amber-300 rounded-2xl p-3 text-sm">
          <Ic.Warn size={18} className="shrink-0" /><span>Complete o perfil (aba Perfil) pra calcular o gasto calórico.</span>
        </div>
      )}
      <Card>
        <Titulo icon={Ic.Flame} accent={accent}>Balanço do dia</Titulo>
        {!completo ? <p className="text-slate-500 text-sm">Preencha o perfil pra ver o gasto calórico.</p> : (
          <>
            <div className="grid grid-cols-2 gap-2 text-center mb-3">
              <div className="bg-slate-800/60 rounded-xl py-2"><div className="text-[11px] text-slate-400">Gasto total</div><div className="font-bold text-lg">{gastoTotal}<span className="text-xs text-slate-500"> kcal</span></div></div>
              <div className="bg-slate-800/60 rounded-xl py-2"><div className="text-[11px] text-slate-400">Consumido</div><div className="font-bold text-lg">{Math.round(consumido)}<span className="text-xs text-slate-500"> kcal</span></div></div>
            </div>
            <div className={`rounded-xl py-3 text-center ${deficit ? "bg-emerald-500/15 border border-emerald-500/30" : "bg-orange-500/15 border border-orange-500/30"}`}>
              <div className="text-[11px] text-slate-300">{deficit ? "Déficit" : "Superávit"} do dia</div>
              <div className={`font-bold text-2xl ${deficit ? "text-emerald-400" : "text-orange-400"}`}>{deficit ? "−" : "+"}{Math.abs(Math.round(saldo))} kcal</div>
              <div className="text-[11px] text-slate-400 mt-0.5">≈ {kgSem.toFixed(2)} kg/semana neste ritmo</div>
            </div>
            <div className="mt-3 space-y-2">
              <div>
                <div className="flex justify-between text-[11px] mb-1"><span className="text-slate-400">Proteína</span><span className={protTotal >= metaProt ? "text-emerald-400" : "text-slate-300"}>{Math.round(protTotal)} / {metaProt} g</span></div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden"><div className={`h-full ${protTotal >= metaProt ? "bg-emerald-500" : "bg-sky-500"}`} style={{ width: `${pctProt}%` }} /></div>
              </div>
              <div>
                <div className="flex justify-between text-[11px] mb-1"><span className="text-slate-400">Gordura</span><span className={gordAlta ? "text-red-400" : "text-slate-300"}>{Math.round(gordTotal)} g · {pctGord}%</span></div>
                <div className="h-2 bg-slate-800 rounded-full overflow-hidden"><div className={`h-full ${gordAlta ? "bg-red-500" : "bg-slate-500"}`} style={{ width: `${Math.min(100, pctGord)}%` }} /></div>
              </div>
            </div>
            {consumido > 0 && kcalMin > 0 && consumido < kcalMin && <Aviso>Faltam {Math.round(kcalMin - consumido)} kcal pro mínimo de {kcalMin}.</Aviso>}
            {gordAlta && <Aviso>Gordura acima de {LIMITE_GORD}% das calorias.</Aviso>}
          </>
        )}
      </Card>

      <Card>
        <Titulo icon={Ic.Drop} accent={accent} extra={<span className="text-xs text-slate-400">{(D.agua/1000).toFixed(2)} / {(metaAgua/1000).toFixed(2)} L</span>}>Água</Titulo>
        <div className="h-3 bg-slate-800 rounded-full overflow-hidden mb-3"><div className="h-full transition-all" style={{ width: `${Math.min(100, Math.round((D.agua/metaAgua)*100))||0}%`, background: accent }} /></div>
        <div className="grid grid-cols-4 gap-2">
          {[200,300,500].map((ml) => <button key={ml} onClick={() => setDiaCampo("agua", Math.max(0, D.agua+ml))} className="bg-slate-800 rounded-lg py-2 text-xs font-medium active:scale-95">+{ml}</button>)}
          <button onClick={() => setDiaCampo("agua", Math.max(0, D.agua-200))} className="bg-slate-800/60 text-slate-400 rounded-lg py-2 text-xs active:scale-95">−200</button>
        </div>
      </Card>

      <Card>
        <Titulo icon={Ic.Dumbbell} accent={accent} extra={<span className="text-xs text-slate-400">{t.treino} kcal</span>}>Treino</Titulo>
        <div className="space-y-3">
          <BlocoTreino label="Musculação" min={D.musc} onMin={(v)=>setDiaCampo("musc",v)} kcal={t.kMusc} minMeta={50} sel={D.muscInt} onSel={(v)=>setDiaCampo("muscInt",v)} opts={Object.keys(MUSC)} />
          <BlocoTreino label="Aeróbico" min={D.aero} onMin={(v)=>setDiaCampo("aero",v)} kcal={t.kAero} minMeta={15} sel={D.aeroTipo} onSel={(v)=>setDiaCampo("aeroTipo",v)} opts={Object.keys(AERO)} />
          <BlocoTreino label="Alongamento" min={D.along} onMin={(v)=>setDiaCampo("along",v)} kcal={t.kAlong} minMeta={20} />
        </div>
      </Card>

      <Card>
        <Titulo icon={Ic.Food} accent={accent} extra={<span className="text-xs text-slate-400">{Math.round(consumido)} kcal</span>}>Comidas</Titulo>
        {D.comidas.length > 0 && (
          <div className="space-y-1.5 mb-3">
            {D.comidas.map((c,i) => (
              <div key={i} className="flex items-center justify-between bg-slate-800/50 rounded-lg px-3 py-2">
                <div className="flex-1 min-w-0 mr-2"><div className="text-sm truncate">{c.nome}</div><div className="text-[10px] text-slate-500">{Math.round(n(c.prot))}g prot · {Math.round(n(c.gord))}g gord</div></div>
                <span className="text-slate-300 text-xs mr-2 shrink-0">{Math.round(n(c.kcal))}</span>
                <button onClick={() => setDiaCampo("comidas", D.comidas.filter((_,j)=>j!==i))} className="text-slate-600 shrink-0"><Ic.Trash size={14}/></button>
              </div>
            ))}
          </div>
        )}
        <div className="flex gap-2 mb-2">
          <input value={nomeC} onChange={(e)=>setNomeC(e.target.value)} placeholder="Ex.: 2 ovos e 1 pão" className="flex-1 bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none" />
          <button onClick={addComida} className="bg-slate-700 rounded-lg px-3 active:scale-95"><Ic.Plus size={16}/></button>
        </div>
        <div className="grid grid-cols-3 gap-2">
          <input value={kcalC} onChange={(e)=>setKcalC(e.target.value)} type="number" placeholder="kcal" className="bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none" />
          <input value={protC} onChange={(e)=>setProtC(e.target.value)} type="number" placeholder="prot g" className="bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none" />
          <input value={gordC} onChange={(e)=>setGordC(e.target.value)} type="number" placeholder="gord g" className="bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none" />
        </div>
      </Card>

      <Card>
        <Titulo icon={Ic.Scale} accent={accent}>Peso e composição</Titulo>
        <div className="grid grid-cols-3 gap-2">
          <div><label className="text-[11px] text-slate-500 block mb-1">Peso (kg)</label><Num value={D.peso} onChange={(e)=>setDiaCampo("peso",e.target.value)} placeholder="—" /></div>
          <div><label className="text-[11px] text-slate-500 block mb-1">Gordura (%)</label><Num value={D.gord} onChange={(e)=>setDiaCampo("gord",e.target.value)} placeholder="—" /></div>
          <div><label className="text-[11px] text-slate-500 block mb-1">Massa (kg)</label><Num value={D.massa} onChange={(e)=>setDiaCampo("massa",e.target.value)} placeholder="—" /></div>
        </div>
      </Card>
    </div>
  );
}
function BlocoTreino({ label, min, onMin, kcal, minMeta, sel, onSel, opts }) {
  const ok = min >= minMeta;
  return (
    <div className="bg-slate-800/50 rounded-xl p-3">
      <div className="flex items-center justify-between mb-2">
        <span className="text-sm font-medium flex items-center gap-1.5">{label}{ok && <span className="text-emerald-400 text-xs">✓</span>}</span>
        <span className="text-xs text-slate-400">{kcal} kcal · meta {minMeta}min</span>
      </div>
      <div className="flex gap-2">
        <div className="flex items-center gap-1.5">
          <button onClick={()=>onMin(Math.max(0,min-5))} className="w-8 h-9 bg-slate-700 rounded-lg text-sm active:scale-95">−</button>
          <div className="w-14 text-center bg-slate-900 rounded-lg py-2 text-sm font-semibold">{min}′</div>
          <button onClick={()=>onMin(min+5)} className="w-8 h-9 bg-slate-700 rounded-lg text-sm active:scale-95">+</button>
        </div>
        {opts && <select value={sel} onChange={(e)=>onSel(e.target.value)} className="flex-1 bg-slate-900 rounded-lg px-2 text-xs outline-none">{opts.map(o=><option key={o} value={o}>{o}</option>)}</select>}
      </div>
    </div>
  );
}
function SaudeHistorico({ P, dias, accent }) {
  const diasOrd = useMemo(() => Object.entries(dias || {}).sort((a,b)=>a[0].localeCompare(b[0])), [dias]);
  const pesos = diasOrd.filter(([,r])=>n(r.peso)>0).map(([d,r])=>({d:curto(d), peso:n(r.peso), gordPct:n(r.gord)||null, massa:n(r.massa)||null}));
  return (
    <div className="space-y-4">
      <Card>
        <Titulo icon={Ic.Scale} accent={accent}>Peso</Titulo>
        {pesos.length < 2 ? <p className="text-slate-500 text-sm">Registre o peso em pelo menos 2 dias (aba Hoje).</p> : (
          <div className="h-48 -ml-2"><ResponsiveContainer width="100%" height="100%">
            <LineChart data={pesos}>
              <CartesianGrid stroke="#1e293b" vertical={false} />
              <XAxis dataKey="d" tick={{fontSize:10,fill:"#64748b"}} />
              <YAxis domain={["dataMin - 1","dataMax + 1"]} tick={{fontSize:10,fill:"#64748b"}} width={35} />
              <Tooltip contentStyle={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:8,fontSize:12}} />
              {n(P.meta)>0 && <ReferenceLine y={n(P.meta)} stroke="#10b981" strokeDasharray="4 4" />}
              <Line type="monotone" dataKey="peso" stroke={accent} strokeWidth={2} dot={{r:3}} />
            </LineChart>
          </ResponsiveContainer></div>
        )}
      </Card>
      {pesos.some(p=>p.massa) && (
        <Card>
          <Titulo icon={Ic.Chart} accent={accent}>Massa magra (kg)</Titulo>
          <div className="h-40 -ml-2"><ResponsiveContainer width="100%" height="100%">
            <LineChart data={pesos}>
              <CartesianGrid stroke="#1e293b" vertical={false} />
              <XAxis dataKey="d" tick={{fontSize:10,fill:"#64748b"}} />
              <YAxis tick={{fontSize:10,fill:"#64748b"}} width={35} domain={["dataMin - 1","dataMax + 1"]} />
              <Tooltip contentStyle={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:8,fontSize:12}} />
              <Line type="monotone" dataKey="massa" stroke="#34d399" strokeWidth={2} dot={{r:3}} connectNulls />
            </LineChart>
          </ResponsiveContainer></div>
        </Card>
      )}
      {pesos.some(p=>p.gordPct) && (
        <Card>
          <Titulo icon={Ic.Chart} accent={accent}>Gordura (%)</Titulo>
          <div className="h-40 -ml-2"><ResponsiveContainer width="100%" height="100%">
            <LineChart data={pesos}>
              <CartesianGrid stroke="#1e293b" vertical={false} />

/* ================= SAÚDE: exames (com leitura de foto via OCR local) ================= */
function parseRelaxFit(texto) {
  // Layout esperado: nome da métrica numa linha, e em seguida dois números (antes/depois)
  // com um delta no meio. Ex.: "Peso(kg)" \n "118.8" \n "2.9" \n "115.9"
  const linhas = texto.split("\n").map(l=>l.trim()).filter(Boolean);
  const nums = (s) => (s.match(/-?\d+[.,]?\d*/g) || []).map(x=>parseFloat(x.replace(",",".")));
  const metricas = ["Peso","IMC","Gordura corporal","Taxa muscular","Músculo Esquelético","Massa Corporal Magra",
    "Gordura Subcutânea","Gordura Visceral","Massa Muscular","Massa Óssea","Água Corporal","Proteína","TMB",
    "Idade do corpo","Massa Gorda","Peso da Água","Massa de Proteína"];
  const achados = [];
  for (let i=0;i<linhas.length;i++) {
    const linha = linhas[i];
    const metrica = metricas.find(m => linha.toLowerCase().startsWith(m.toLowerCase()));
    if (!metrica) continue;
    const unidadeMatch = linha.match(/\(([^)]+)\)/);
    const unidade = unidadeMatch ? unidadeMatch[1] : "";
    // procura os 2 valores numéricos nas próximas linhas (pulando o delta)
    const candidatos = [];
    for (let j=i+1; j<Math.min(i+6, linhas.length) && candidatos.length<3; j++) {
      const vals = nums(linhas[j]);
      if (vals.length) candidatos.push(...vals);
    }
    if (candidatos.length >= 2) {
      achados.push({ nome: metrica, unidade, valorAntes: candidatos[0], valorDepois: candidatos[candidatos.length-1] });
    }
  }
  return achados;
}

const CATEGORIES = { "Moradia":"#8AA6C1","Alimentação":"#C9A227","Transporte":"#7C8FA6","Saúde":"#4F9D69","Lazer":"#B5657A","Pessoal":"#9C8ACB","Assinaturas":"#5FA8A0","Pet":"#D08A4C","Outros":"#6B7280" };
const CAT_LIST = Object.keys(CATEGORIES);
const MILESTONE_LIST = [300000,500000,1000000];
function nextYM(y,m){ m+=1; if(m>12){m=1;y+=1;} return [y,m]; }
function ymKey(y,m){ return `${y}-${String(m).padStart(2,"0")}`; }
function pedroSpecials(y,m){
  let extra=0; const notes=[];
  if (m===5 && y>=2027){ const plr=24000+(y-2027)*1000; extra+=plr; notes.push(`PLR ${fmtCompact(plr)}`); }
  if (m===7 && y>=2027){ extra+=5400+6850; notes.push("FGTS+13º"); }
  if (m===12){ extra+=4000; notes.push("13º"); }
  if (y===2027 && m===9){ extra+=15000; notes.push("aporte GE"); }
  return {extra, notes};
}
function noSpecials(){ return {extra:0, notes:[]}; }
function buildProjection({ startTotal, startY, startM, returnRate, monthlyTarget, specialsFn }) {
  let y=startY, m=startM, total=startTotal;
  const points = [{month: ymKey(y,m), value: total}];
  const milestoneMonth = {};
  MILESTONE_LIST.forEach(k => { if (total>=k) milestoneMonth[k]=ymKey(y,m); });
  for (let i=0;i<300;i++){
    [y,m]=nextYM(y,m);
    const {extra} = specialsFn(y,m);
    total = total*(1+returnRate) + monthlyTarget + extra;
    const key = ymKey(y,m);
    points.push({month:key, value: total});
    MILESTONE_LIST.forEach(k => { if(!milestoneMonth[k] && total>=k) milestoneMonth[k]=key; });
    if (milestoneMonth[1000000]) break;
  }
  return { points, milestoneMonth };
}
function EditableNumber({ value, display, onCommit, style, accent }) {
  const [editing, setEditing] = useState(false); const [draft, setDraft] = useState(value);
  if (editing) return <input autoFocus type="number" style={{...style, background:"transparent", border:"none", borderBottom:`1px solid ${accent}`, outline:"none", maxWidth:200}}
    value={draft} onChange={(e)=>setDraft(n(e.target.value))} onBlur={()=>{onCommit(draft);setEditing(false);}} onKeyDown={(e)=>{if(e.key==="Enter"){onCommit(draft);setEditing(false);}}} />;
  return <div onClick={()=>{setDraft(value);setEditing(true);}} style={{...style, cursor:"pointer"}}>{display}</div>;
}

function FinProjecoes({ investments, baseInvested, totalInvested, monthlyTarget, thisMonth, returnRate, setReturnRate, accent, specialsFn }) {

  let running = baseInvested; const realByMonth={};
  monthsWithData.forEach(mo => { running += investments.filter(i=>i.month===mo).reduce((s,i)=>s+i.amount,0); realByMonth[mo]=running; });
  if (!realByMonth[thisMonth]) realByMonth[thisMonth]=totalInvested;
  const { points, milestoneMonth } = buildProjection({ startTotal: totalInvested, startY, startM, returnRate, monthlyTarget, specialsFn });
  const chartData = points.map((p,idx)=>({ month: mesLabel(p.month), real: realByMonth[p.month]!==undefined?realByMonth[p.month]:(idx===0?totalInvested:null), projetado: p.value }));

const CORES_HABITO = ["#38bdf8","#fb923c","#a855f7","#ef4444","#22c55e","#14b8a6","#eab308"];

function diasAtras(qtd) {
  const out = [];
  for (let i = qtd - 1; i >= 0; i--) out.push(addDays(hoje(), -i));
  return out;
}

function calcularStreaks(itemId, registros) {
  // percorre os últimos 400 dias pra achar a sequência atual e o recorde
  let atual = 0, recorde = 0, corrente = 0;
  let d = hoje();
  // sequência atual: conta pra trás a partir de hoje (ou ontem, se hoje ainda não foi feito)
  let cursor = hoje();
  if (!registros[cursor]?.[itemId]) cursor = addDays(cursor, -1);
  while (registros[cursor]?.[itemId]) { atual++; cursor = addDays(cursor, -1); }
  // maior sequência histórica, varrendo os últimos 365 dias
  const todos = diasAtras(365);
  todos.forEach((dia) => {
    if (registros[dia]?.[itemId]) { corrente++; recorde = Math.max(recorde, corrente); }
    else corrente = 0;
  });
  return { atual, recorde };
}

          <Titulo icon={Ic.Edit} accent={accent}>{editando ? "Editar hábito" : "Novo hábito"}</Titulo>
          <input value={nome} onChange={(e)=>setNome(e.target.value)} placeholder="Nome do hábito" className="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none mb-2" />
          <input value={descricao} onChange={(e)=>setDescricao(e.target.value)} placeholder="Descrição (opcional)" className="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none mb-2" />
          <div className="flex gap-2 mb-2">
            {CORES_HABITO.map(c => (
              <button key={c} onClick={()=>setCor(c)} className="w-8 h-8 rounded-lg flex items-center justify-center" style={{background:c}}>
                {cor===c && <span style={{color:"#020617"}}>✓</span>}
              </button>
            ))}
          </div>
          <select value={grupoId} onChange={(e)=>setGrupoId(e.target.value)} className="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none mb-2">
            <option value="">Sem grupo</option>
            {grupos.map(g => <option key={g.id} value={g.id}>{g.nome}</option>)}
          </select>
          <input value={novoGrupoNome} onChange={(e)=>setNovoGrupoNome(e.target.value)} placeholder="ou crie um grupo novo (opcional)" className="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none mb-2" />
          <div className="flex gap-2">
            <button onClick={()=>setShowForm(false)} className="flex-1 bg-slate-800 rounded-lg py-2 text-sm">Cancelar</button>
            <button onClick={salvarItem} className="flex-1 rounded-lg py-2 text-sm font-semibold" style={{background:accent,color:"#020617"}}>Salvar</button>
          </div>
          {editando && <button onClick={()=>{excluirItem(editando);setShowForm(false);}} className="w-full mt-2 text-xs text-red-400">Excluir hábito</button>}
        </Card>
      )}

      {itens.length===0 && !showForm && <p className="text-slate-500 text-sm text-center py-6">Nenhum hábito ainda — toca em "Novo hábito" pra começar.</p>}

      {porGrupo.map(({ grupo, lista }) => (
        <Card key={grupo?.id || "sem-grupo"}>
          {grupo && <div className="text-xs font-semibold uppercase tracking-wide mb-2" style={{color:grupo.cor}}>{grupo.nome}</div>}
          <div className="space-y-2">
            {lista.map((it) => {
              const feito = !!registros[hoje()]?.[it.id];
              const { atual, recorde } = calcularStreaks(it.id, registros);
              return (
                <div key={it.id} className="flex items-center gap-3 bg-slate-800/50 rounded-xl px-3 py-2.5">
                  <button onClick={() => toggleHoje(it.id)} className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 font-bold text-sm"
                    style={feito ? { background: it.cor, color: "#020617" } : { border: `2px solid ${it.cor}`, color: it.cor }}>
                    {atual > 0 ? atual : "○"}
                  </button>
                  <button onClick={() => abrirEdicao(it)} className="flex-1 text-left min-w-0">
                    <div className="text-sm text-slate-200 truncate">{it.nome}</div>
                    {it.descricao && <div className="text-[10px] text-slate-500 truncate">{it.descricao}</div>}
                  </button>
                  <div className="text-right shrink-0">
                    <div className="text-[10px] text-slate-500">recorde</div>
                    <div className="text-xs font-semibold text-slate-300">{recorde}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      ))}
    </div>
  );
}
/* ================= APP PRINCIPAL ================= */
const KEY = "trindade:v1";
const DEFAULT_EXPENSES_PEDRO = [
  { id:"e1", desc:"Alimentação (almoço no trabalho + iFood)", category:"Alimentação", amount:500 },
  { id:"e2", desc:"Namoro (passagens Petrópolis–SP)", category:"Lazer", amount:800 },
  { id:"e3", desc:"Plano de saúde", category:"Saúde", amount:900 },
  { id:"e4", desc:"Locomoção (ônibus municipal)", category:"Transporte", amount:500 },
  { id:"e5", desc:"Wellhub", category:"Saúde", amount:82.4 },
  { id:"e6", desc:"Assinatura", category:"Assinaturas", amount:48.99 },
  { id:"e7", desc:"Tratamento capilar (Manual)", category:"Pessoal", amount:99.12 },
  { id:"e8", desc:"Barbeiro", category:"Pessoal", amount:110 },
  { id:"e9", desc:"Compras", category:"Pessoal", amount:100 },
  { id:"e10", desc:"Cachorro (parcela 10x)", category:"Pet", amount:40 },
];
function pessoaDefault(sexo, kcalMin, isPedro) {
  return {
    saude: { perfil: novoPerfilSaude(sexo, kcalMin), dias: {}, exames: [] },
    tarefas: { itens: isPedro ? [
      { id: uid(), label:"Academia", hora: 20 }, { id: uid(), label:"Aeróbico", hora: 20 },
      { id: uid(), label:"Creatina", hora: 12 }, { id: uid(), label:"Remédio capilar", hora: 21 },
    ] : [], dias: {} },
    financeiro: isPedro
      ? { expenses: DEFAULT_EXPENSES_PEDRO, investments: [], baseInvested: 231000, monthlyTarget: 7200, returnRate: 0.008 }
      : { expenses: [], investments: [], baseInvested: 0, monthlyTarget: 0, returnRate: 0.008 },
    estudo: { itens: [], dias: {}, aulas: [] },
    trabalho: isPedro ? { itens: [] } : undefined,
    habitos: !isPedro ? { grupos: [], itens: [], registros: {} } : undefined,
  };
}
function defaultData() {
  return {
    pedro: pessoaDefault("m", 1800, true),
    mariana: pessoaDefault("f", 1400, false),
    relacionamento: [],
    pets: [],
  };
}

function TrindadeApp() {
  const [data, setData] = useState(null);
  const [activePerson, setActivePerson] = useState("pedro");
  const [area, setArea] = useState("saude");
  const [subSaude, setSubSaude] = useState("hoje");
  const [diaSaude, setDiaSaude_] = useState(hoje());
  const [subFin, setSubFin] = useState("resumo");
  const [subEstudo, setSubEstudo] = useState("tarefas");
  const [loading, setLoading] = useState(true);
  const [notifOn, setNotifOn] = useState(false);
  const primeiro = useRef(true);
  const defaultsRef = useRef(null);
  if (!defaultsRef.current) defaultsRef.current = defaultData();

  const carregar = async () => {
    let fetched = null;
    try {
      const r = await window.storage.get(KEY, true);
      if (r) fetched = JSON.parse(r.value);
    } catch (e) { fetched = null; }

    setData((prev) => {
      if (fetched) {
        const def = defaultsRef.current;
        primeiro.current = true;
        return {
          ...def, ...fetched,
          pedro: { ...def.pedro, ...(fetched.pedro || {}) },
          mariana: { ...def.mariana, ...(fetched.mariana || {}) },
        };
      }
      // nada veio do Firebase: se já tem dados carregados na tela, mantém como está
      // (evita apagar tudo por causa de uma falha passageira de rede)
      if (prev) return prev;
      primeiro.current = true;
      return defaultsRef.current;
    });
  };

  useEffect(() => {
    carregar().finally(()=>setLoading(false));
    const aoVoltar = () => { if (document.visibilityState==="visible") carregar(); };
    document.addEventListener("visibilitychange", aoVoltar);
    window.addEventListener("focus", aoVoltar);
    if ("Notification" in window) setNotifOn(Notification.permission === "granted");
    return () => { document.removeEventListener("visibilitychange", aoVoltar); window.removeEventListener("focus", aoVoltar); };
  }, []);

  useEffect(() => {
    if (!data) return;
    if (primeiro.current) { primeiro.current = false; return; }
    const t = setTimeout(async () => { try { await window.storage.set(KEY, JSON.stringify(data), true); } catch(e){} }, 500);
    return () => clearTimeout(t);
  }, [data]);

  const pedirNotificacao = async () => {
    if (!("Notification" in window)) return;
    const perm = await Notification.requestPermission();
    setNotifOn(perm === "granted");
  };

  const P = data ? data[activePerson] : null;
  const theme = THEMES[activePerson];
  const accent = theme.accent;

  const setPerfilSaude = (campo, val) => setData(d => ({...d, [activePerson]: {...d[activePerson], saude: {...d[activePerson].saude, perfil: {...d[activePerson].saude.perfil, [campo]: val}}}}));
  const diaSaudeAtual = P ? (P.saude.dias[diaSaude] || novoDiaSaude()) : novoDiaSaude();
  const setDiaSaudeCampo = (campo, val) => setData(d => {
    const dias = {...d[activePerson].saude.dias, [diaSaude]: {...(d[activePerson].saude.dias[diaSaude]||novoDiaSaude()), [campo]: val}};
    return {...d, [activePerson]: {...d[activePerson], saude: {...d[activePerson].saude, dias}}};
  });
  const setExamesSaude = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], saude: {...d[activePerson].saude, exames: val}}}));

  const setTarefas = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], tarefas: val}}));
  const setTrabalho = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], trabalho: val}}));
  const setHabitos = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], habitos: typeof val === "function" ? val(d[activePerson].habitos) : val}}));
  const setEstudoTarefas = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], estudo: {...d[activePerson].estudo, itens: val.itens, dias: val.dias}}}));
  const setAulas = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], estudo: {...d[activePerson].estudo, aulas: val}}}));

  const setExpenses = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], financeiro: {...d[activePerson].financeiro, expenses: val}}}));
  const setInvestments = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], financeiro: {...d[activePerson].financeiro, investments: val}}}));
  const setBaseInvested = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], financeiro: {...d[activePerson].financeiro, baseInvested: val}}}));
  const setMonthlyTarget = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], financeiro: {...d[activePerson].financeiro, monthlyTarget: val}}}));
  const setReturnRate = (val) => setData(d => ({...d, [activePerson]: {...d[activePerson], financeiro: {...d[activePerson].financeiro, returnRate: val}}}));

  const setRelacionamento = (val) => setData(d => ({...d, relacionamento: val}));
  const setPets = (val) => setData(d => ({...d, pets: val}));

  const totalExpenses = P ? P.financeiro.expenses.reduce((s,e)=>s+n(e.amount),0) : 0;
  const totalContributed = P ? P.financeiro.investments.reduce((s,i)=>s+n(i.amount),0) : 0;
  const totalInvested = P ? P.financeiro.baseInvested + totalContributed : 0;
  const thisMonth = mesAtual();
  const monthContrib = P ? P.financeiro.investments.filter(i=>i.month===thisMonth).reduce((s,i)=>s+n(i.amount),0) : 0;
  const byCategory = P ? CAT_LIST.map(cat => ({cat, total: P.financeiro.expenses.filter(e=>e.category===cat).reduce((s,e)=>s+n(e.amount),0)})).filter(c=>c.total>0) : [];

  /* -------- alertas: tarefas atrasadas, exames fora da faixa, meta financeira em risco -------- */
  const alertas = useMemo(() => {
    if (!P) return [];
    const lista = [];
    const horaAtual = horaAgora(); const diaHoje = hoje();
    (P.tarefas.itens||[]).forEach(it => {
      const feito = !!(P.tarefas.dias?.[diaHoje]?.[it.id]);
      if (!feito && it.hora!=null && horaAtual >= it.hora) lista.push(`Tarefa atrasada: ${it.label}`);
    });
    (P.saude.exames||[]).forEach(e => {
      if ((e.min!=null && e.valor<e.min) || (e.max!=null && e.valor>e.max)) lista.push(`Exame fora da faixa: ${e.nome} (${e.valor})`);
    });
    const diaAtual = new Date().getDate(); const diasNoMes = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    const ritmoEsperado = P.financeiro.monthlyTarget * (diaAtual/diasNoMes);
    if (P.financeiro.monthlyTarget>0 && monthContrib < ritmoEsperado*0.85 && diaAtual>5) lista.push(`Meta de aporte do mês em risco (${fmt(monthContrib)} de ${fmt(P.financeiro.monthlyTarget)})`);
    return lista;
  }, [P, monthContrib]);

  useEffect(() => {
    if (!P || !notifOn || alertas.length===0 || !("serviceWorker" in navigator)) return;
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification(`Trindade — ${theme.label}`, { body: alertas.slice(0,3).join("\n"), icon: "icon-192.png" });
    }).catch(()=>{});
    // eslint-disable-next-line
  }, [activePerson]);

  if (loading || !data || !P) return <div className="min-h-screen bg-slate-950 text-slate-400 flex items-center justify-center">Carregando…</div>;

  const AREAS = [
    { k:"saude", l:"Saúde", icon: Ic.Health },
    { k:"tarefas", l:"Tarefas", icon: Ic.Check },
    { k:"financeiro", l:"Financeiro", icon: Ic.Money },
    { k:"estudo", l:"Estudo", icon: Ic.Study },
    ...(P.trabalho ? [{ k:"trabalho", l:"Trabalho", icon: Ic.Work }] : []),
    ...(P.habitos ? [{ k:"habitos", l:"Hábitos", icon: Ic.Check }] : []),
    { k:"casal", l:"Casal", icon: Ic.Heart },
    { k:"pet", l:"Pet", icon: Ic.Pet },
  ];

  return (
    <div className="min-h-screen bg-slate-950 text-slate-100" style={{paddingBottom:"calc(84px + env(safe-area-inset-bottom))"}}>
      <div className="px-4 pt-5 pb-3">
        <div className="flex items-center justify-between mb-1">
          <h1 className="text-xl font-bold" style={{fontFamily:"'Fraunces',serif"}}>Trindade</h1>
          <button onClick={pedirNotificacao} className="text-xs px-2 py-1 rounded-lg flex items-center gap-1" style={{background: notifOn ? "rgba(74,222,128,0.15)" : "#1e293b", color: notifOn ? "#4ade80" : "#94a3b8"}}>
            <Ic.Bell size={12}/> {notifOn ? "notificações ativas" : "ativar notificações"}
          </button>
        </div>

        {alertas.length>0 && (
          <div className="mt-2 bg-red-500/15 border border-red-500/40 rounded-xl p-3 space-y-1">
            {alertas.map((a,i) => <div key={i} className="text-xs text-red-300 flex items-start gap-1.5"><Ic.Warn size={12} className="shrink-0 mt-0.5"/>{a}</div>)}
          </div>
        )}
      </div>

      <div className="flex gap-1 px-4 overflow-x-auto pb-2 mb-3" style={{scrollbarWidth:"none"}}>
        {AREAS.map(a => (
          <button key={a.k} onClick={()=>setArea(a.k)} className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium whitespace-nowrap shrink-0"
            style={area===a.k ? {background:"#1e293b", color:accent, boxShadow:`inset 0 0 0 1px ${accent}`} : {background:"#0f172a", color:"#64748b"}}>
            <a.icon size={14}/>{a.l}
          </button>
        ))}
      </div>

      <div className="px-4">
        {area==="saude" && (
          <>
            <div className="flex gap-1 mb-3">
              {[["hoje","Hoje"],["historico","Histórico"],["exames","Exames"],["perfil","Perfil"]].map(([k,l]) => (
                <button key={k} onClick={()=>setSubSaude(k)} className="flex-1 py-1.5 text-xs rounded-lg font-medium" style={subSaude===k?{background:"#1e293b",color:accent}:{background:"#0f172a",color:"#64748b"}}>{l}</button>
              ))}
            </div>
            {subSaude==="hoje" && <SaudeHoje P={P.saude.perfil} D={diaSaudeAtual} dia={diaSaude} onDia={setDiaSaude_} setPerfilCampo={setPerfilSaude} setDiaCampo={setDiaSaudeCampo} accent={accent} />}
            {subSaude==="historico" && <SaudeHistorico P={P.saude.perfil} dias={P.saude.dias} accent={accent} />}
            {subSaude==="exames" && <SaudeExames exames={P.saude.exames} setExames={setExamesSaude} accent={accent} />}
            {subSaude==="perfil" && <SaudePerfil P={P.saude.perfil} setPerfilCampo={setPerfilSaude} accent={accent} />}
          </>
        )}

        {area==="tarefas" && <ChecklistDiario bucket={P.tarefas} setBucket={setTarefas} accent={accent} corAtraso={true} />}

        {area==="financeiro" && (
          <>
            <div className="flex gap-1 mb-3">
              {[["resumo","Resumo"],["gastos","Gastos"],["aportes","Aportes"],["projecoes","Projeções"]].map(([k,l]) => (
                <button key={k} onClick={()=>setSubFin(k)} className="flex-1 py-1.5 text-xs rounded-lg font-medium" style={subFin===k?{background:"#1e293b",color:accent}:{background:"#0f172a",color:"#64748b"}}>{l}</button>
              ))}
            </div>
            {subFin==="resumo" && <FinResumo totalExpenses={totalExpenses} byCategory={byCategory} monthContrib={monthContrib} monthlyTarget={P.financeiro.monthlyTarget} accent={accent} />}
            {subFin==="gastos" && <FinGastos expenses={P.financeiro.expenses} setExpenses={setExpenses} accent={accent} />}
            {subFin==="aportes" && <FinAportes investments={P.financeiro.investments} setInvestments={setInvestments} thisMonth={thisMonth} accent={accent} />}
            {subFin==="projecoes" && <FinProjecoes investments={P.financeiro.investments} baseInvested={P.financeiro.baseInvested} totalInvested={totalInvested} monthlyTarget={P.financeiro.monthlyTarget} thisMonth={thisMonth} returnRate={P.financeiro.returnRate} setReturnRate={setReturnRate} accent={accent} specialsFn={activePerson==="pedro"?pedroSpecials:noSpecials} />}
            <div className="mt-3 bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
              <span className="text-xs text-slate-400">Base investida / meta mensal</span>
              <div className="flex gap-3">
                <EditableNumber value={P.financeiro.baseInvested} display={fmt(P.financeiro.baseInvested)} onCommit={setBaseInvested} accent={accent} style={{fontSize:12, color:"#e2e8f0"}} />
                <EditableNumber value={P.financeiro.monthlyTarget} display={fmt(P.financeiro.monthlyTarget)} onCommit={setMonthlyTarget} accent={accent} style={{fontSize:12, color:accent, fontWeight:600}} />
              </div>
            </div>
          </>
        )}

        {area==="estudo" && (
          <>
            <div className="flex gap-1 mb-3">
              {[["tarefas","To-do"],["cronograma","Cronograma"]].map(([k,l]) => (
                <button key={k} onClick={()=>setSubEstudo(k)} className="flex-1 py-1.5 text-xs rounded-lg font-medium" style={subEstudo===k?{background:"#1e293b",color:accent}:{background:"#0f172a",color:"#64748b"}}>{l}</button>
              ))}
            </div>
            {subEstudo==="tarefas" && <ChecklistDiario bucket={{itens:P.estudo.itens, dias:P.estudo.dias}} setBucket={setEstudoTarefas} accent={accent} corAtraso={true} />}
            {subEstudo==="cronograma" && <Cronograma aulas={P.estudo.aulas||[]} setAulas={setAulas} accent={accent} />}
          </>
        )}

        {area==="trabalho" && P.trabalho && <ChecklistDiario bucket={P.trabalho} setBucket={setTrabalho} accent={accent} corAtraso={false} />}

        {area==="habitos" && P.habitos && <Habitos habitos={P.habitos} setHabitos={setHabitos} accent={accent} />}

        {area==="casal" && <DiarioCasal entradas={data.relacionamento} setEntradas={setRelacionamento} activePerson={activePerson} accent={accent} />}

        {area==="pet" && <AreaPet pets={data.pets} setPets={setPets} accent={accent} />}
      </div>

      <div
        style={{
          position: "fixed", left: 0, right: 0, bottom: 0, zIndex: 50,
          display: "flex", background: "rgba(2,6,23,0.92)", backdropFilter: "blur(14px)",
          WebkitBackdropFilter: "blur(14px)", borderTop: "1px solid #1e293b",
          paddingBottom: "env(safe-area-inset-bottom)",
        }}
      >
        {Object.entries(THEMES).map(([k, t]) => {
          const ativo = activePerson === k;
          return (
            <button
              key={k}
              onClick={() => setActivePerson(k)}
              className="flex-1 flex flex-col items-center justify-center gap-0.5"
              style={{ padding: "9px 0 7px", color: ativo ? t.accent : "#64748b" }}
            >
              <span
                className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold"
                style={ativo ? { background: t.accent, color: "#020617" } : { background: "#1e293b", color: "#64748b" }}
              >
                {t.label[0]}
              </span>
              <span className="text-[11px] font-medium">{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

</script>
<script>
  function mostrarErro(titulo, err) {
    var root = document.getElementById("root");
    var msg = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err);
    root.innerHTML =
      '<div style="padding:20px;font-family:monospace;color:#fca5a5;background:#020617;min-height:100vh;">' +
      '<div style="color:#f87171;font-weight:bold;margin-bottom:10px;font-size:14px;">' + titulo + '</div>' +
      '<pre style="white-space:pre-wrap;font-size:11px;line-height:1.5;background:#111827;padding:12px;border-radius:8px;">' +
      msg.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") +
      '</pre></div>';
  }
  window.addEventListener("error", function(e) {
    if (!document.getElementById("root").innerHTML) {
      var alvo = e.target && e.target.src ? "Falha ao carregar: " + e.target.src : "Erro de execução:";
      mostrarErro(alvo, e.error || e.message || "recurso não carregou");
    }
  }, true);
  window.addEventListener("unhandledrejection", function(e) {
    if (!document.getElementById("root").innerHTML) mostrarErro("Erro (promise):", e.reason);
  });
  try {
    var src = document.getElementById("app-code").textContent;
    var output = Babel.transform(src, { presets: ["react"] }).code;
    var script = document.createElement("script");
    script.textContent = output + "\n\nconst root = ReactDOM.createRoot(document.getElementById('root')); root.render(React.createElement(TrindadeApp));";
    document.body.appendChild(script);
  } catch (err) {
    mostrarErro("Erro ao processar o código (sintaxe):", err);
  }
</script>

</body>
